<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Import Google Icon Font-->
     <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
 
    <!-- Compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href = "css/estilo.css">
   <title>Agendar tarefas</title>
</head>
<body>
    <div class="container">
        <h1 class="center"> Tarefas</h1>
        <p class="center">Organizando sua agenda!</p>
        <ul class="center">
            <li>
                <i class="Small material-icons">event_note</i>
                Deveres Importantes!!
            </li>
            <li>Preste atenção !!!</li>
        </ul>

       <p>Título:</p>
       <input type="text" class="campoTitulo">
       <span class="erroTitulo erro"></span>

       <p>Observações:</p>
       <input type="text" class="campoObs">
       <span class="erroObs erro"></span>

       <p>Prioridade:</p>
       <select class="campoPrioridade">
    <option value="Baixa">Baixa</option>
    <option value="Média" selected>Média</option>
    <option value="Alta">Alta</option>
       </select>
        <div class="divBotao">
            <a id="botao" class="btn-floating btn-floating btn-large waves-effect waves-light red">
                <i class="material-icons">arrow_downward</i>
            </a>
        </div>
        <section class="tarefas">
            <table class="highlight">
                <thead>
                    <tr>
                        <th>Tarefa</th>
                        <th>Observações</th>
                        <th>Prioridades</th>
                        <th>Concluir</th>
                        <th>Apagar</th>
                    </tr>
                </thead>

                <tbody>

                </tbody>
            </table>
        </section>

        <script src="js/jquery-3.5.1.js"></script>
           <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
        <script src="js/main.js"></script>
        
    </div>
</body>
</html>
